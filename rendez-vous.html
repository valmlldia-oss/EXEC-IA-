<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <title>Réservation — bientôt disponible · EXEC'IA</title>
  <meta name="description" content="La réservation en ligne EXEC'IA arrive très bientôt. En attendant, écrivez à valerie@exec-ia.ai.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://exec-ia.ai/rendez-vous.html" />
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { background: var(--ivory); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; margin: 0; }
    .rdv-card { max-width: 600px; width: 100%; background: var(--white); border: 1.5px solid var(--deep); border-radius: 1.5rem; padding: clamp(44px, 6vw, 76px) clamp(28px, 5vw, 60px); text-align: center; box-shadow: 0 8px 40px rgba(99,59,74,.12); }
    .rdv-logo { width: 62px; height: auto; margin: 0 auto 26px; display: block; }
    .rdv-eyebrow { font-family: var(--sans); text-transform: uppercase; letter-spacing: .2em; font-size: .74rem; color: var(--rose); margin: 0 0 18px; font-weight: 700; }
    .rdv-title { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.12; color: var(--plum); margin: 0 0 24px; }
    .rdv-title span { color: var(--rose); }
    .rdv-text { font-family: var(--sans); font-size: 1.07rem; line-height: 1.75; color: var(--text); margin: 0 auto 14px; max-width: 44ch; }
    .rdv-text strong { color: var(--plum); font-weight: 600; }
    .rdv-actions { margin-top: 36px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .rdv-btn { display: inline-flex; align-items: center; gap: 9px; background: var(--rose); color: #FAF6F2; text-decoration: none; font-family: var(--sans); font-weight: 600; font-size: 1.02rem; padding: 15px 34px; border-radius: 50px; transition: background .2s, transform .2s; }
    .rdv-btn:hover { background: #b04f52; transform: translateY(-1px); }
    .rdv-back { font-family: var(--sans); color: var(--grey); text-decoration: none; font-size: .95rem; border-bottom: 1px solid transparent; transition: border-color .2s; }
    .rdv-back:hover { border-bottom-color: var(--grey); }
  </style>
</head>
<body>
  <main class="rdv-card">
    <img src="assets/favicon.png" alt="EXEC'IA" class="rdv-logo">
    <p class="rdv-eyebrow">EXEC'IA</p>
    <h1 class="rdv-title">La réservation en ligne<br>arrive <span>très bientôt</span></h1>
    <p class="rdv-text">Je finalise la mise en place de mon agenda en ligne pour vous permettre de réserver un échange en quelques clics.</p>
    <p class="rdv-text">En attendant, écrivez-moi directement&nbsp;: je vous réponds <strong>personnellement sous 24&nbsp;h</strong>.</p>
    <div class="rdv-actions">
      <a href="mailto:valerie@exec-ia.ai" class="rdv-btn">✉️ valerie@exec-ia.ai</a>
      <a href="index.html" class="rdv-back">← Retour à l'accueil</a>
    </div>
  </main>
</body>
</html>
