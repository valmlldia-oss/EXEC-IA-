<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-label="Cycle d'un agent IA en six étapes : percevoir, raisonner, planifier, coordonner avec l'humain, agir, apprendre, puis retour à percevoir.">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#633B4A"/></marker></defs>
<rect width="1120" height="770" fill="#FAF6F2"/>
<path d="M652.0 159.5 A250 250 0 0 1 715.3 196.1" fill="none" stroke="#633B4A" stroke-width="2.5" marker-end="url(#fl)"/>
<path d="M807.3 355.4 A250 250 0 0 1 807.3 428.6" fill="none" stroke="#633B4A" stroke-width="2.5" marker-end="url(#fl)"/>
<path d="M715.3 587.9 A250 250 0 0 1 652.0 624.5" fill="none" stroke="#633B4A" stroke-width="2.5" marker-end="url(#fl)"/>
<path d="M468.0 624.5 A250 250 0 0 1 404.7 587.9" fill="none" stroke="#633B4A" stroke-width="2.5" marker-end="url(#fl)"/>
<path d="M312.7 428.6 A250 250 0 0 1 312.7 355.4" fill="none" stroke="#633B4A" stroke-width="2.5" marker-end="url(#fl)"/>
<path d="M404.7 196.1 A250 250 0 0 1 468.0 159.5" fill="none" stroke="#633B4A" stroke-width="2.5" marker-end="url(#fl)"/>
<circle cx="560.0" cy="142.0" r="82" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/>
<text x="560.0" y="126.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#633B4A">1</text>
<text x="560.0" y="156.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#633B4A">Percevoir</text>
<text x="560.0" y="44.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">rassembler les données fiables</text>
<circle cx="776.5" cy="267.0" r="82" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/>
<text x="776.5" y="251.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#633B4A">2</text>
<text x="776.5" y="281.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#633B4A">Raisonner</text>
<text x="872.5" y="250.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">comprendre le</text>
<text x="872.5" y="276.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">contexte</text>
<circle cx="776.5" cy="517.0" r="82" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/>
<text x="776.5" y="501.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#633B4A">3</text>
<text x="776.5" y="531.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#633B4A">Planifier</text>
<text x="872.5" y="513.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">définir les étapes</text>
<circle cx="560.0" cy="642.0" r="82" fill="#C75F62" stroke="#633B4A" stroke-width="1.5"/>
<text x="560.0" y="626.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#FAF6F2">4</text>
<text x="560.0" y="656.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#FAF6F2">Coordonner</text>
<text x="560.0" y="762.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">soumettre le plan à l'humain</text>
<circle cx="343.5" cy="517.0" r="82" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/>
<text x="343.5" y="501.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#633B4A">5</text>
<text x="343.5" y="531.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#633B4A">Agir</text>
<text x="247.5" y="500.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">exécuter dans les</text>
<text x="247.5" y="526.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">règles fixées</text>
<circle cx="343.5" cy="267.0" r="82" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/>
<text x="343.5" y="251.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#633B4A">6</text>
<text x="343.5" y="281.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#633B4A">Apprendre</text>
<text x="247.5" y="250.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">mesurer et</text>
<text x="247.5" y="276.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="23" fill="#633B4A">corriger</text>
<text x="560" y="388" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="32" font-weight="600" fill="#633B4A">Un agent IA</text>
<text x="560" y="418" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#633B4A">Boucle de décision</text>
</svg>
