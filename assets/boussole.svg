<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rose des vents">
  <g fill="none" stroke="#C75F62" stroke-linecap="round" stroke-linejoin="round">

    <!-- Anneau extérieur -->
    <circle cx="100" cy="100" r="86" stroke-width="1.8" opacity=".5"/>
    <!-- Anneau intérieur -->
    <circle cx="100" cy="100" r="66" stroke-width="1.2" opacity=".3"/>

    <!-- Graduations cardinales (longues) -->
    <g stroke-width="2" opacity=".75">
      <line x1="100" y1="14"  x2="100" y2="28"/>
      <line x1="100" y1="172" x2="100" y2="186"/>
      <line x1="14"  y1="100" x2="28"  y2="100"/>
      <line x1="172" y1="100" x2="186" y2="100"/>
    </g>

    <!-- Graduations intercardinales (courtes) -->
    <g stroke-width="1.3" opacity=".42">
      <line x1="139.2" y1="21.5"  x2="134.3" y2="32.9"/>
      <line x1="178.5" y1="60.8"  x2="167.1" y2="65.7"/>
      <line x1="178.5" y1="139.2" x2="167.1" y2="134.3"/>
      <line x1="139.2" y1="178.5" x2="134.3" y2="167.1"/>
      <line x1="60.8"  y1="178.5" x2="65.7"  y2="167.1"/>
      <line x1="21.5"  y1="139.2" x2="32.9"  y2="134.3"/>
      <line x1="21.5"  y1="60.8"  x2="32.9"  y2="65.7"/>
      <line x1="60.8"  y1="21.5"  x2="65.7"  y2="32.9"/>
    </g>

    <!-- Branches secondaires de la rose (est / ouest) -->
    <path d="M100 100 L166 100 L100 108 Z" fill="#C75F62" opacity=".26" stroke="none"/>
    <path d="M100 100 L34 100 L100 92 Z"  fill="#C75F62" opacity=".26" stroke="none"/>

    <!-- Aiguille : pointe nord pleine, pointe sud évidée -->
    <path d="M100 30 L112 100 L100 100 Z" fill="#C75F62" opacity="1" stroke="none"/>
    <path d="M100 30 L88 100 L100 100 Z"  fill="#C75F62" opacity=".6" stroke="none"/>
    <path d="M100 170 L112 100 L100 100 Z" fill="none" stroke-width="1.5" opacity=".6"/>
    <path d="M100 170 L88 100 L100 100 Z"  fill="none" stroke-width="1.5" opacity=".38"/>

    <!-- Pivot central -->
    <circle cx="100" cy="100" r="5.5" fill="#F4EDE7" stroke-width="1.6" opacity=".9"/>
  </g>
</svg>
