<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Six-step cycle of an AI agent: perceive, reason, plan, coordinate with the human, act, learn, then back to perceive."><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#633B4A"/></marker></defs><rect width="900" height="600" fill="#FAF6F2"/><path d="M511.9 120.4 A190 190 0 0 1 574.7 156.6" fill="none" stroke="#633B4A" stroke-width="2" marker-end="url(#fl)"/><path d="M636.5 263.7 A190 190 0 0 1 636.5 336.3" fill="none" stroke="#633B4A" stroke-width="2" marker-end="url(#fl)"/><path d="M574.7 443.4 A190 190 0 0 1 511.9 479.6" fill="none" stroke="#633B4A" stroke-width="2" marker-end="url(#fl)"/><path d="M388.1 479.6 A190 190 0 0 1 325.3 443.4" fill="none" stroke="#633B4A" stroke-width="2" marker-end="url(#fl)"/><path d="M263.5 336.3 A190 190 0 0 1 263.5 263.7" fill="none" stroke="#633B4A" stroke-width="2" marker-end="url(#fl)"/><path d="M325.3 156.6 A190 190 0 0 1 388.1 120.4" fill="none" stroke="#633B4A" stroke-width="2" marker-end="url(#fl)"/><circle cx="450.0" cy="110.0" r="54" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/><text x="450.0" y="100.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#633B4A">1</text><text x="450.0" y="120.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#633B4A">Perceive</text><text x="450.0" y="35.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#633B4A">gather reliable data</text><circle cx="614.5" cy="205.0" r="54" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/><text x="614.5" y="195.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#633B4A">2</text><text x="614.5" y="215.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#633B4A">Reason</text><text x="683.8" y="170.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" fill="#633B4A">understand the context</text><circle cx="614.5" cy="395.0" r="54" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/><text x="614.5" y="385.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#633B4A">3</text><text x="614.5" y="405.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#633B4A">Plan</text><text x="683.8" y="440.0" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" fill="#633B4A">define the steps</text><circle cx="450.0" cy="490.0" r="54" fill="#C75F62" stroke="#633B4A" stroke-width="1.5"/><text x="450.0" y="480.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FAF6F2">4</text><text x="450.0" y="500.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#FAF6F2">Coordinate</text><text x="450.0" y="575.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#633B4A">submit the plan to the human</text><circle cx="285.5" cy="395.0" r="54" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/><text x="285.5" y="385.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#633B4A">5</text><text x="285.5" y="405.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#633B4A">Act</text><text x="216.2" y="440.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#633B4A">execute within the agreed rules</text><circle cx="285.5" cy="205.0" r="54" fill="#F4EDE7" stroke="#633B4A" stroke-width="1.5"/><text x="285.5" y="195.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#633B4A">6</text><text x="285.5" y="215.0" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="16" font-weight="600" fill="#633B4A">Learn</text><text x="216.2" y="170.0" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#633B4A">measure and correct</text><text x="450" y="294" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-weight="600" fill="#633B4A">An AI agent</text><text x="450" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#633B4A">decision loop</text></svg>
