<!doctype html><meta charset="utf-8"><body>
<script>
async function check(url,w){
  return new Promise(res=>{
    const f=document.createElement('iframe'); f.style.width=w+'px'; f.style.height='900px'; f.src=url;
    f.onload=()=>{ setTimeout(()=>{ const d=f.contentDocument; const out=[];
      d.querySelectorAll('.reveal').forEach(e=>e.classList.add('visible','in','is-visible'));
      const se=d.scrollingElement; if(se.scrollWidth>se.clientWidth+1) out.push('PAGE scroll '+se.scrollWidth+'>'+se.clientWidth);
      const boxes='.article-author,.article-intro,.article-close,.article-tldr,.article-related,.persp-card,.article-header-text,.article-book-col,.article-long,.footer-col,.article-cta-wrap';
      d.querySelectorAll('p,a,span,h1,h2,h3,li,time,strong').forEach(e=>{
        if(!e.textContent.trim()) return; const b=e.closest(boxes); if(!b||b===e) return;
        const r=e.getBoundingClientRect(), br=b.getBoundingClientRect();
        if(r.width>0 && (r.right>br.right+2 || r.left<br.left-2)) out.push((e.className||e.tagName)+' in '+b.className.split(' ')[0]+' +'+Math.round(r.right-br.right)+'px: '+e.textContent.trim().slice(0,50));
      });
      f.remove(); res([...new Set(out)]); },600); };
    document.body.appendChild(f);
  });
}
window.runAll=async function(urls,widths){ const R={}; for(const u of urls){ for(const w of widths){ const o=await check(u,w); if(o.length) R[u+'@'+w]=o.slice(0,6);} } return R; };
</script>
